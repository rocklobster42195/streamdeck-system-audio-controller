<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App Mute</title>
  <link rel="stylesheet" href="pi-theme.css" />
  <link rel="stylesheet" href="sac.css" />
  <script src="locales.generated.js"></script>
  <script src="pi.js"></script>
</head>

<body hidden>
  <div class="pi-hint sac-help" data-i18n="pi.app_key_help"></div>

  <pi-section title="pi.app">
    <pi-select setting="app" source="apps" label-setting="appName" placeholder="pi.choose_app" empty="pi.no_apps"></pi-select>
  </pi-section>

  <pi-section title="pi.display">
    <pi-toggle setting="showLevel" data-default="true" label="pi.show_level"></pi-toggle>
  </pi-section>

  <div class="pi-footer"><span data-plugin-version>SA-C</span></div>
</body>

</html>
